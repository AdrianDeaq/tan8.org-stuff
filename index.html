<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal - Danh Sách Dự Án</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .avatar {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .links-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 18px 22px;
            border-radius: 16px;
            text-decoration: none;
            color: #f8fafc;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: left;
        }

        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.25);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .link-title {
            font-weight: 600;
            font-size: 16px;
        }

        .link-desc {
            font-size: 12px;
            color: #94a3b8;
        }

        .arrow {
            font-size: 18px;
            color: #64748b;
            transition: transform 0.25s ease, color 0.25s ease;
        }

        .link-card:hover .arrow {
            transform: translateX(4px);
            color: #3b82f6;
        }

        footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar">🎮</div>
        <h1>Cổng Trò Chơi</h1>
        <p class="subtitle">Chọn dự án bên dưới để bắt đầu trải nghiệm</p>

        <div class="links-wrapper">
            <!-- Link 1 -->
            <a href="https://tan-gioi-dau-truong.onrender.com/" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <span class="link-title">⚔️ Tân Giới Đấu Trường</span>
                    <span class="link-desc">tan-gioi-dau-truong.onrender.com</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Link 2 -->
            <a href="https://tantowerdefense.itch.io/ttd" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <span class="link-title">🏰 Tan Tower Defense (TTD)</span>
                    <span class="link-desc">tantowerdefense.itch.io/ttd</span>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- Link 3 -->
            <a href="https://phamthanhan1612.itch.io/test" target="_blank" rel="noopener noreferrer" class="link-card">
                <div class="link-info">
                    <span class="link-title">🧪 Phiên Bản Thử Nghiệm (Test)</span>
                    <span class="link-desc">phamthanhan1612.itch.io/test</span>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <footer>
            &copy; 2026 Game Portal
        </footer>
    </div>

</body>
</html>
